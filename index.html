}

:root[data-theme="dark"]{

  --accent:#5fc7b2; --accent-ink:#08201b; --accent-soft:#1c2f2a;

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 64px}
header.top{padding:20px 0 12px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
h1{font-family:var(--display);font-size:26px;line-height:1.15;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:0}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line)}
.bar-in{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.pct{font-family:var(--display);font-size:30px;line-height:1;min-width:86px}
.pill{display:inline-block;padding:3px 12px;border-radius:999px;font-weight:700;font-size:13px;letter-spacing:.04em}
.pill.pass{background:var(--good-bg);color:var(--good)} .pill.fail{background:var(--bad-bg);color:var(--bad)} .pill.none{background:var(--na-bg);color:var(--na)}
.meta{color:var(--muted);font-size:13px}
.meta b{color:var(--ink);font-weight:600}
.meta .crit{color:var(--bad);font-weight:600}
.prog{flex:1 1 140px;height:6px;background:var(--line);border-radius:3px;overflow:hidden;min-width:120px}
.prog i{display:block;height:100%;background:var(--accent)}
nav.tabs{display:flex;gap:4px;margin:12px 0 16px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs a{padding:8px 14px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}

.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 14px;font-weight:600;font-size:14px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger.armed{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
section.sec{margin-top:22px}
.sec-h{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;justify-content:space-between;padding:0 2px 8px}
.sec-h h2{font-size:17px;margin:0;font-weight:700}
.chip{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--na-bg);color:var(--na)}
.chip.pass{background:var(--good-bg);color:var(--good)} .chip.fail{background:var(--bad-bg);color:var(--bad)}
ul.items{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
li.item{padding:12px 14px;border-top:1px solid var(--line);border-left:4px solid transparent;display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:center}
li.item:first-child{border-top:0}

.ih{display:flex;gap:10px;align-items:baseline;min-width:0}
.code{font-weight:700;font-size:12px;color:var(--muted);min-width:24px}
.txt{margin:0}
.w3{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;padding:1px 7px;border-radius:4px;background:var(--bad-bg);color:var(--bad);white-space:nowrap}
.src{display:inline-block;margin-left:6px;font-size:11px;color:var(--muted);white-space:nowrap}
.rate{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.rate button{border:0;border-left:1px solid var(--line);background:var(--surface);padding:6px 10px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.rate button:first-child{border-left:0}
.rate button:hover{background:var(--accent-soft)}
.rate button[aria-pressed="true"].rD{background:var(--good-bg);color:var(--good)}
.rate button[aria-pressed="true"].rC{background:var(--warn-bg);color:var(--warn)}
.rate button[aria-pressed="true"].rK{background:var(--bad-bg);color:var(--bad)}
.rate button[aria-pressed="true"].rN{background:var(--na-bg);color:var(--ink)}
.fix{grid-column:1/-1;display:grid;grid-template-columns:2fr 1fr;gap:8px}
.fix[hidden]{display:none}
.fix textarea{min-height:44px;resize:vertical}
.fix textarea.need{border-color:var(--warn);background:var(--warn-bg)}
.fix input{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-size:14px;width:100%}
.fix .topic{grid-column:1/-1;font-size:12px;color:var(--muted)}
h3{font-size:15px;margin:0 0 10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right}
.scroll{overflow-x:auto}
.meter{height:8px;background:var(--line);border-radius:4px;overflow:hidden;min-width:90px}
.meter i{display:block;height:100%;background:var(--good)} .meter.low i{background:var(--bad)}
.stack{display:flex;flex-direction:column;gap:16px}
.empty{color:var(--muted);margin:0}
.note{font-size:13px;color:var(--muted);margin:10px 0 0}
details summary{cursor:pointer;font-weight:600;color:var(--accent)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px);z-index:9}
@media (max-width:640px){

  .rate button{flex:1;padding:8px 4px}
  .fix{grid-template-columns:1fr}
  h1{font-size:22px}
}

var RATES=[["D","Đạt"],["C","Cần cải thiện"],["K","Không đạt"],["N","N/A"]];
var RNAME={D:"Đạt",C:"Cần cải thiện",K:"Không đạt",N:"N/A"};
var VIEWS={"cham-diem":"Chấm điểm","tong-hop":"Tổng hợp","lich-su":"Lịch sử"};
var KEY="audit-buffet-draft-v1";var HKEY="audit-buffet-history-v1";
var saved={history:[]};
try{var s=JSON.parse(localStorage.getItem(HKEY));if(s&&Array.isArray(s.history))saved=s;}catch(e){}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function blank(){return {info:{date:today(),outlet:"",shift:"",auditor:"",team:"",thr:85},r:{},n:{}};}
var draft=blank();
try{var d=JSON.parse(localStorage.getItem(KEY));if(d&&d.info&&d.r&&d.n)draft=d;}catch(e){}
var saveT=null;
function persist(){clearTimeout(saveT);saveT=setTimeout(function(){try{localStorage.setItem(KEY,JSON.stringify(draft));}catch(e){}},250);}
var caps={downloads:true};
function esc(x){return String(x==null?"":x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function $(q,el){return (el||document).querySelector(q);}
function fmtPct(p){return p==null?"–":(Math.round(p*10)/10).toFixed(1)+"%";}
function fmtDate(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||"");return m?m[3]+"/"+m[2]+"/"+m[1]:(s||"");}

function calc(r,thr){
  var o={got:0,max:0,crit:0,done:0,fails:0,sec:{},topic:{}};
  Object.keys(SEC).forEach(function(k){o.sec[k]={got:0,max:0,fails:0,n:0,done:0};});
  ITEMS.forEach(function(it){
    var v=r[it[0]],w=it[3],s=o.sec[it[1]];s.n++;
    if(!v)return; o.done++; s.done++;
    if(v==="N")return;
    o.max+=w;s.max+=w;
    if(v==="D"){o.got+=w;s.got+=w;return;}
    if(v==="C"){o.got+=w/2;s.got+=w/2;}
    if(v==="K"&&w===3)o.crit++;
    o.fails++;s.fails++;o.topic[it[4]]=(o.topic[it[4]]||0)+1;
  });
  o.pct=o.max?o.got/o.max*100:null;
  o.result=o.max?(o.pct>=thr&&o.crit===0?"PASS":"FAIL"):null;
  return o;
}
function thr(){var t=Number(draft.info.thr);return t>0&&t<=100?t:85;}

var app=document.getElementById("app");
function view(){var h=location.hash.replace("#","");return VIEWS[h]?h:"cham-diem";}

function shell(){
  app.innerHTML='<div class="wrap"><header class="top"><h1>Audit Buffet Long Bien Golf Course</h1><p class="sub">'+ITEMS.length+' tiêu chí · '+Object.keys(SEC).length+' hạng mục</p></header>'+
  '<div class="bar"><div class="bar-in" id="bar"></div></div><nav class="tabs" id="tabs"></nav><main id="main"></main></div>';
}
function renderBar(){
  var c=calc(draft.r,thr());
  var cls=c.result==="PASS"?"pass":c.result==="FAIL"?"fail":"none";
  $("#bar").innerHTML='<span class="pct">'+fmtPct(c.pct)+'</span><span class="pill '+cls+'">'+(c.result||"CHƯA CHẤM")+'</span>'+
   '<span class="meta">Đã chấm <b>'+c.done+'/'+ITEMS.length+'</b> · Ngưỡng <b>'+thr()+'%</b> · '+(c.crit?'<span class="crit">'+c.crit+' lỗi trọng yếu</span>':'0 lỗi trọng yếu')+'</span>'+
   '<span class="prog" aria-hidden="true"><i style="width:'+(c.done/ITEMS.length*100)+'%"></i></span>';
  return c;
}
function renderTabs(){
  var v=view();
  $("#tabs").innerHTML=Object.keys(VIEWS).map(function(k){return '<a href="#'+k+'"'+(k===v?' aria-current="page"':'')+'>'+VIEWS[k]+(k==="lich-su"&&saved.history.length?' ('+saved.history.length+')':'')+'</a>';}).join("");
}
function secChip(k,c){
  var s=c.sec[k];if(!s.max)return '<span class="chip" data-chip="'+k+'">'+s.done+'/'+s.n+' đã chấm</span>';
  var p=s.got/s.max*100;
  return '<span class="chip '+(p>=thr()?"pass":"fail")+'" data-chip="'+k+'">'+fmtPct(p)+' · '+s.done+'/'+s.n+(s.fails?' · '+s.fails+' FAIL':'')+'</span>';
}
function itemHtml(it){
  var code=it[0],v=draft.r[code]||"",n=draft.n[code]||{},fail=v==="C"||v==="K";
  return '<li class="item'+(v?' is-'+v:'')+'" data-code="'+code+'"><div class="ih"><span class="code">'+code+'</span><p class="txt">'+esc(it[2])+
    (it[3]===3?'<span class="w3">Trọng yếu</span>':'')+(it[5]!=="SOP"?'<span class="src">'+esc(it[5])+'</span>':'')+'</p></div>'+
    '<div class="rate" role="group" aria-label="Đánh giá '+code+'">'+RATES.map(function(r){return '<button type="button" class="r'+r[0]+'" data-rate="'+r[0]+'" aria-pressed="'+(v===r[0])+'">'+r[1]+'</button>';}).join("")+'</div>'+
    '<div class="fix"'+(fail?'':' hidden')+'><textarea id="note-'+code+'" data-note placeholder="Ghi chú lỗi sai: sai gì, ở đâu, lúc nào" aria-label="Ghi chú lỗi sai '+code+'" class="'+(n.note?'':'need')+'">'+esc(n.note)+'</textarea>'+
    '<input id="staff-'+code+'" data-staff placeholder="Nhân viên liên quan" aria-label="Nhân viên liên quan '+code+'" value="'+esc(n.staff)+'">'+
    '<span class="topic">Chủ đề training: '+esc(TOPICS[it[4]])+'</span></div></li>';
}
function renderChecklist(c){
  var i=draft.info;
  var h='<div class="card"><div class="grid">'+
   '<label class="f" for="f-date">Ngày audit<input id="f-date" type="date" data-info="date" value="'+esc(i.date)+'"></label>'+
   '<label class="f" for="f-outlet">Nhà hàng / Outlet<input id="f-outlet" data-info="outlet" value="'+esc(i.outlet)+'"></label>'+
   '<label class="f" for="f-shift">Ca phục vụ<select id="f-shift" data-info="shift">'+["","Buffet sáng","Buffet trưa","Buffet tối","Tiệc buffet"].map(function(o){return '<option'+(o===i.shift?' selected':'')+' value="'+o+'">'+(o||"Chọn ca")+'</option>';}).join("")+'</select></label>'+
   '<label class="f" for="f-auditor">Người đánh giá<input id="f-auditor" data-info="auditor" value="'+esc(i.auditor)+'"></label>'+
   '<label class="f" for="f-team">Nhân viên / Tổ được đánh giá<input id="f-team" data-info="team" value="'+esc(i.team)+'"></label>'+
   '<label class="f" for="f-thr">Ngưỡng đạt (%)<input id="f-thr" type="number" min="1" max="100" data-info="thr" value="'+esc(i.thr)+'"></label>'+
   '</div><div class="actions"><button class="btn primary" type="button" id="b-save">Lưu lần audit này</button>'+
   '<button class="btn" type="button" id="b-allpass">Đánh dấu Đạt cho tiêu chí chưa chấm</button>'+
   '<button class="btn danger" type="button" id="b-reset">Xóa để chấm mới</button></div>'+
   '<p class="note">Bản đang chấm được giữ tạm trên trình duyệt này. Bấm “Lưu lần audit này” để ghi vào Lịch sử. Lịch sử được lưu riêng trên trình duyệt của thiết bị này; tải CSV để lưu hồ sơ chung.</p></div>';
  Object.keys(SEC).forEach(function(k){
    h+='<section class="sec"><div class="sec-h"><h2>'+esc(SEC[k])+'</h2>'+secChip(k,c)+'</div><ul class="items">'+ITEMS.filter(function(it){return it[1]===k;}).map(itemHtml).join("")+'</ul></section>';
  });
  $("#main").innerHTML=h;
}
function failRows(r,n){
  return ITEMS.filter(function(it){var v=r[it[0]];return v==="C"||v==="K";}).map(function(it){var x=n[it[0]]||{};
    return '<tr><td><b>'+it[0]+'</b>'+(it[3]===3?' <span class="w3">Trọng yếu</span>':'')+'</td><td>'+esc(it[2])+'</td><td><span class="chip fail">'+RNAME[r[it[0]]]+'</span></td><td>'+esc(x.note||"")+'</td><td>'+esc(x.staff||"")+'</td></tr>';}).join("");
}
function renderSummary(c){
  var t=thr(),h='<div class="stack">';
  h+='<div class="card"><h3>Kết quả theo hạng mục</h3><div class="scroll"><table><thead><tr><th>Hạng mục</th><th class="n">Điểm</th><th class="n">Tỷ lệ đạt</th><th></th><th class="n">FAIL</th><th>Kết quả</th></tr></thead><tbody>'+
   Object.keys(SEC).map(function(k){var s=c.sec[k],p=s.max?s.got/s.max*100:null,ok=p!=null&&p>=t;
    return '<tr><td>'+esc(SEC[k])+'</td><td class="n">'+(s.max?s.got+' / '+s.max:'–')+'</td><td class="n">'+fmtPct(p)+'</td><td><div class="meter'+(ok?'':' low')+'"><i style="width:'+(p||0)+'%"></i></div></td><td class="n">'+s.fails+'</td><td>'+(p==null?'<span class="chip">Chưa chấm</span>':'<span class="chip '+(ok?'pass">PASS':'fail">FAIL')+'</span>')+'</td></tr>';}).join("")+
   '</tbody></table></div><p class="note">PASS chung khi tỷ lệ đạt từ '+t+'% trở lên và không có tiêu chí trọng yếu nào “Không đạt”. “Cần cải thiện” nhận 50% điểm và tính là FAIL ở tiêu chí đó. N/A không tính điểm.</p></div>';
  var tp=Object.keys(c.topic).map(function(k){return [TOPICS[k],c.topic[k]];}).sort(function(a,b){return b[1]-a[1];});
  h+='<div class="card"><h3>Nhu cầu training</h3>'+(tp.length?'<table><thead><tr><th>Chủ đề</th><th class="n">Số tiêu chí FAIL</th></tr></thead><tbody>'+tp.map(function(x){return '<tr><td>'+esc(x[0])+'</td><td class="n">'+x[1]+'</td></tr>';}).join("")+'</tbody></table>':'<p class="empty">Chưa có tiêu chí FAIL.</p>')+'</div>';
  var fr=failRows(draft.r,draft.n);
  h+='<div class="card"><h3>Danh sách lỗi cần khắc phục</h3>'+(fr?'<div class="scroll"><table><thead><tr><th>Mã</th><th>Tiêu chuẩn</th><th>Đánh giá</th><th>Ghi chú lỗi sai</th><th>Nhân viên</th></tr></thead><tbody>'+fr+'</tbody></table></div>':'<p class="empty">Chưa có tiêu chí FAIL.</p>')+
   '<div class="actions"><button class="btn" type="button" id="b-copy">Sao chép báo cáo lỗi</button>'+(caps.downloads?'<button class="btn" type="button" id="b-csv">Tải CSV lần audit này</button>':'')+'</div></div></div>';
  $("#main").innerHTML=h;
}
function renderHistory(){
  var H=saved.history,h='<div class="stack">';
  if(!H.length){h+='<div class="card"><p class="empty">Chưa có lần audit nào được lưu. Chấm xong ở tab Chấm điểm rồi bấm “Lưu lần audit này”.</p></div>';}
  else{
    h+='<div class="card"><h3>Các lần audit đã lưu</h3><div class="scroll"><table><thead><tr><th>Ngày</th><th>Ca</th><th>Tổ / Nhân viên</th><th>Người đánh giá</th><th class="n">Tỷ lệ đạt</th><th>Kết quả</th><th>Lỗi</th><th></th></tr></thead><tbody>'+
     H.map(function(a,ix){var codes=Object.keys(a.f||{});
       var det=codes.length?'<details><summary>'+codes.length+' FAIL'+(a.crit?', '+a.crit+' trọng yếu':'')+'</summary>'+codes.map(function(cd){var x=a.f[cd];return '<div><b>'+esc(cd)+'</b> '+RNAME[x[0]]+(x[1]?': '+esc(x[1]):'')+(x[2]?' ('+esc(x[2])+')':'')+'</div>';}).join("")+'</details>':'0';
       return '<tr><td>'+fmtDate(a.date)+'</td><td>'+esc(a.shift)+'</td><td>'+esc(a.team)+'</td><td>'+esc(a.auditor)+'</td><td class="n">'+fmtPct(a.pct)+'</td><td><span class="chip '+(a.result==="PASS"?"pass":"fail")+'">'+a.result+'</span></td><td>'+det+'</td><td><button class="btn danger" type="button" data-del="'+ix+'">Xóa</button></td></tr>';}).join("")+
     '</tbody></table></div>'+(caps.downloads?'<div class="actions"><button class="btn" type="button" id="b-csvh">Tải CSV lịch sử</button></div>':'')+'</div>';
    var cnt={},tc={};
    H.forEach(function(a){Object.keys(a.f||{}).forEach(function(cd){cnt[cd]=(cnt[cd]||0)+1;});});
    var byCode={};ITEMS.forEach(function(it){byCode[it[0]]=it;});
    Object.keys(cnt).forEach(function(cd){var it=byCode[cd];if(it)tc[it[4]]=(tc[it[4]]||0)+cnt[cd];});
    var top=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a];}).slice(0,10);
    h+='<div class="card"><h3>Tiêu chí FAIL nhiều nhất ('+H.length+' lần audit)</h3>'+(top.length?'<div class="scroll"><table><thead><tr><th>Mã</th><th>Tiêu chuẩn</th><th class="n">Số lần FAIL</th></tr></thead><tbody>'+top.map(function(cd){return '<tr><td><b>'+esc(cd)+'</b></td><td>'+esc(byCode[cd]?byCode[cd][2]:"")+'</td><td class="n">'+cnt[cd]+'</td></tr>';}).join("")+'</tbody></table></div>':'<p class="empty">Chưa ghi nhận lỗi.</p>')+'</div>';
    var tl=Object.keys(tc).sort(function(a,b){return tc[b]-tc[a];});
    h+='<div class="card"><h3>Ưu tiên training theo lịch sử</h3>'+(tl.length?'<table><thead><tr><th>Chủ đề</th><th class="n">Tổng số lần FAIL</th></tr></thead><tbody>'+tl.map(function(k){return '<tr><td>'+esc(TOPICS[k])+'</td><td class="n">'+tc[k]+'</td></tr>';}).join("")+'</tbody></table>':'<p class="empty">Chưa ghi nhận lỗi.</p>')+'</div>';
  }
  $("#main").innerHTML=h+'</div>';
}
function render(){
  var c=renderBar();renderTabs();
  var v=view();
  if(v==="cham-diem")renderChecklist(c);else if(v==="tong-hop")renderSummary(c);else renderHistory();
}
function refreshLight(){
  var c=renderBar();
  Object.keys(SEC).forEach(function(k){var el=$('[data-chip="'+k+'"]');if(el)el.outerHTML=secChip(k,c);});
}
var toastT=null;
function toast(m){var t=$(".toast");if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t);}t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true;},4200);}

function publish(state,okMsg,onFail,onOk){
  try{localStorage.setItem(HKEY,JSON.stringify(state));}
  catch(e){if(onFail)onFail();toast("Trình duyệt không cho lưu dữ liệu. Hãy tắt chế độ ẩn danh rồi thử lại.");return;}
  saved=state;if(onOk)onOk();render();toast(okMsg);
}
function saveAudit(){
  var c=calc(draft.r,thr());
  if(!c.max){toast("Chưa có tiêu chí nào được chấm.");return;}
  var f={};ITEMS.forEach(function(it){var v=draft.r[it[0]];if(v==="C"||v==="K"){var x=draft.n[it[0]]||{};f[it[0]]=[v,x.note||"",x.staff||""];}});
  var i=draft.info;
  var rec={id:Date.now(),date:i.date,outlet:i.outlet,shift:i.shift,auditor:i.auditor,team:i.team,thr:thr(),pct:Math.round(c.pct*10)/10,got:c.got,max:c.max,done:c.done,crit:c.crit,result:c.result,f:f};
  var keep=JSON.stringify(draft);
  clearTimeout(saveT);try{localStorage.removeItem(KEY);}catch(e){}
  publish({history:[rec].concat(saved.history)},"Đã lưu vào Lịch sử.",function(){try{localStorage.setItem(KEY,keep);}catch(e){}},function(){draft=blank();});
}
function csvCell(x){x=String(x==null?"":x);return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x;}
function download(name,rows){
  var data="\ufeff"+rows.map(function(r){return r.map(csvCell).join(",");}).join("\r\n");
  try{var u=URL.createObjectURL(new Blob([data],{type:"text/csv;charset=utf-8"}));var a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},1000);}
  catch(e){toast("Không tải được file trên trình duyệt này.");}
}
function csvCurrent(){
  var i=draft.info,c=calc(draft.r,thr());
  var rows=[["Ngày audit",fmtDate(i.date)],["Nhà hàng",i.outlet],["Ca",i.shift],["Người đánh giá",i.auditor],["Nhân viên / Tổ",i.team],["Tỷ lệ đạt",fmtPct(c.pct)],["Kết quả",c.result||"Chưa chấm"],[],
   ["Mã","Hạng mục","Tiêu chuẩn kiểm tra","Trọng số","Đánh giá","Điểm","Pass/Fail","Ghi chú lỗi sai","Nhân viên liên quan","Chủ đề training","Nguồn"]];
  ITEMS.forEach(function(it){var v=draft.r[it[0]]||"",x=draft.n[it[0]]||{},fail=v==="C"||v==="K";
    rows.push([it[0],SEC[it[1]],it[2],it[3],RNAME[v]||"",v===""||v==="N"?"":(v==="D"?it[3]:v==="C"?it[3]/2:0),v===""?"":v==="N"?"N/A":v==="D"?"PASS":"FAIL",fail?x.note||"":"",fail?x.staff||"":"",TOPICS[it[4]],it[5]]);});
  download("audit-buffet-"+(i.date||today())+".csv",rows);
}
function csvHistory(){
  var rows=[["Ngày","Nhà hàng","Ca","Nhân viên / Tổ","Người đánh giá","Tỷ lệ đạt (%)","Ngưỡng (%)","Lỗi trọng yếu","Kết quả","Tiêu chí FAIL"]];
  saved.history.forEach(function(a){rows.push([fmtDate(a.date),a.outlet,a.shift,a.team,a.auditor,a.pct,a.thr,a.crit,a.result,Object.keys(a.f||{}).map(function(cd){var x=a.f[cd];return cd+" "+RNAME[x[0]]+(x[1]?": "+x[1]:"")+(x[2]?" ("+x[2]+")":"");}).join(" | ")]);});
  download("lich-su-audit-buffet.csv",rows);
}
function copyReport(){
  var i=draft.info,c=calc(draft.r,thr());
  var t="AUDIT BUFFET "+fmtDate(i.date)+(i.shift?" · "+i.shift:"")+(i.team?" · "+i.team:"")+"\nKết quả: "+(c.result||"Chưa chấm")+" · "+fmtPct(c.pct)+" · "+c.crit+" lỗi trọng yếu\n";
  ITEMS.forEach(function(it){var v=draft.r[it[0]];if(v==="C"||v==="K"){var x=draft.n[it[0]]||{};t+="\n"+it[0]+(it[3]===3?" [Trọng yếu]":"")+" · "+RNAME[v]+" · "+it[2]+(x.note?"\n  Lỗi: "+x.note:"")+(x.staff?"\n  Nhân viên: "+x.staff:"");}});
  try{navigator.clipboard.writeText(t).then(function(){toast("Đã sao chép báo cáo.");},function(){toast("Trình duyệt không cho sao chép.");});}catch(e){toast("Trình duyệt không cho sao chép.");}
}
var armed=null;
function arm(btn,label,fn){
  if(armed===btn){armed=null;fn();return;}
  if(armed){armed.classList.remove("armed");armed.textContent=armed.dataset.label;}
  armed=btn;btn.dataset.label=btn.textContent;btn.textContent=label;btn.classList.add("armed");
  setTimeout(function(){if(armed===btn){btn.classList.remove("armed");btn.textContent=btn.dataset.label;armed=null;}},4000);
}
app.addEventListener("click",function(ev){
  var b=ev.target.closest("button");if(!b)return;
  if(b.dataset.rate){
    var li=b.closest("li.item"),code=li.dataset.code,v=b.dataset.rate;
    if(draft.r[code]===v)delete draft.r[code];else draft.r[code]=v;
    var cur=draft.r[code]||"";
    li.className="item"+(cur?" is-"+cur:"");
    li.querySelectorAll(".rate button").forEach(function(x){x.setAttribute("aria-pressed",String(x.dataset.rate===cur));});
    $(".fix",li).hidden=!(cur==="C"||cur==="K");
    persist();refreshLight();return;
  }
  if(b.id==="b-save")return saveAudit();
  if(b.id==="b-allpass"){ITEMS.forEach(function(it){if(!draft.r[it[0]])draft.r[it[0]]="D";});persist();render();return;}
  if(b.id==="b-reset")return arm(b,"Bấm lần nữa để xóa",function(){draft=blank();persist();render();toast("Đã xóa bản đang chấm.");});
  if(b.id==="b-copy")return copyReport();
  if(b.id==="b-csv")return csvCurrent();
  if(b.id==="b-csvh")return csvHistory();
  if(b.dataset.del!=null)return arm(b,"Xóa hẳn?",function(){var H=saved.history.slice();H.splice(Number(b.dataset.del),1);publish({history:H},"Đã xóa lần audit.");});
});
app.addEventListener("input",function(ev){
  var t=ev.target;
  if(t.dataset.info){draft.info[t.dataset.info]=t.value;persist();if(t.dataset.info==="thr")refreshLight();return;}
  var li=t.closest("li.item");if(!li)return;
  var code=li.dataset.code;draft.n[code]=draft.n[code]||{};
  if(t.hasAttribute("data-note")){draft.n[code].note=t.value;t.classList.toggle("need",!t.value.trim());}
  if(t.hasAttribute("data-staff"))draft.n[code].staff=t.value;
  persist();
});
window.addEventListener("hashchange",function(){render();window.scrollTo(0,0);});
shell();render();
})();
</script></body></html>
